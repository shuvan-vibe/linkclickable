<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClickLink</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>ClickLink</h1>
      <label class="switch">
        <input type="checkbox" id="global-toggle" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <div class="status-panel">
      <div id="status-indicator" class="status-indicator"></div>
      <div id="status-text" class="status-text">Checking...</div>
    </div>

    <button id="add-site-btn" class="primary-btn">Add Current Site</button>

    <div class="site-list-container">
      <h3>Whitelisted Sites</h3>
      <ul id="site-list">
        <!-- Sites injected here -->
      </ul>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
